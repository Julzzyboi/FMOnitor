<!DOCTYPE html>
<!--
  Sticky top bar. Ported 1:1 from the React <Topbar> + <NotificationDropdown>
  + <ProfileDropdown>. Dark on mobile, white with a bottom border on desktop.
  The page title on the left is passed in by the layout; the two dropdowns on
  the right are toggled by /js/shell.js.

  React rendered the dropdown panels through a portal with fixed positioning
  to escape overflow clipping; here the topbar just isn't a clipping context,
  so a plain absolutely-positioned panel under each trigger is equivalent.
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="topbar(pageTitle)"
        class="sticky top-0 z-30 flex h-16 items-center justify-between bg-[#141414] px-4 lg:h-20 lg:border-b lg:border-gray-200 lg:bg-white lg:px-6">
  <div class="flex items-center gap-3">
    <button
      type="button"
      id="sidebar-open"
      aria-label="Open navigation menu"
      class="cursor-pointer rounded-md p-2 text-[#fccb35] transition-colors hover:bg-white/10 lg:hidden"
    >
      <i class="fa-solid fa-bars text-[18px]"></i>
    </button>
    <h2 class="text-base font-semibold text-[#fccb35] lg:text-xl lg:text-black" th:text="${pageTitle}">Dashboard</h2>
  </div>

  <div class="flex items-center gap-2 lg:gap-3">

    <!-- Notifications -->
    <div class="relative" data-dropdown>
      <button
        type="button"
        data-dropdown-trigger
        aria-label="Notifications"
        class="flex h-[45px] w-[45px] cursor-pointer items-center justify-center rounded-full text-[#fccb35] transition-colors duration-150 hover:bg-white/10 lg:text-black lg:hover:bg-gray-100"
      >
        <i class="fa-solid fa-bell text-[22px]"></i>
      </button>

      <div
        data-dropdown-panel
        hidden
        class="absolute right-0 mt-2 w-72 max-w-[calc(100vw-2rem)] origin-top-right animate-[dropdown-in_0.15s_ease-out] overflow-hidden rounded-xl border border-gray-100 bg-white shadow-xl"
      >
        <div class="border-b border-gray-100 px-4 py-3">
          <p class="text-sm font-semibold text-gray-900">Notifications</p>
        </div>
        <div class="max-h-72 space-y-4 overflow-y-auto p-4">
          <div class="flex animate-pulse items-start gap-3">
            <div class="h-9 w-9 shrink-0 rounded-full bg-gray-200"></div>
            <div class="flex-1 space-y-2 py-0.5">
              <div class="h-3 w-3/4 rounded bg-gray-200"></div>
              <div class="h-3 w-1/2 rounded bg-gray-200"></div>
            </div>
          </div>
          <div class="flex animate-pulse items-start gap-3">
            <div class="h-9 w-9 shrink-0 rounded-full bg-gray-200"></div>
            <div class="flex-1 space-y-2 py-0.5">
              <div class="h-3 w-3/4 rounded bg-gray-200"></div>
              <div class="h-3 w-1/2 rounded bg-gray-200"></div>
            </div>
          </div>
          <div class="flex animate-pulse items-start gap-3">
            <div class="h-9 w-9 shrink-0 rounded-full bg-gray-200"></div>
            <div class="flex-1 space-y-2 py-0.5">
              <div class="h-3 w-3/4 rounded bg-gray-200"></div>
              <div class="h-3 w-1/2 rounded bg-gray-200"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Profile -->
    <div class="relative" data-dropdown>
      <button
        type="button"
        data-dropdown-trigger
        aria-label="Profile menu"
        class="flex h-[45px] w-[45px] cursor-pointer items-center justify-center rounded-full text-[#fccb35] transition-colors duration-150 hover:bg-white/10 lg:text-black lg:hover:bg-gray-100"
      >
        <img
          th:if="${currentUser != null and currentUser.picture != null}"
          th:src="${currentUser.picture}"
          referrerpolicy="no-referrer"
          alt="Profile"
          class="h-9 w-9 rounded-full object-cover"
        />
        <i th:unless="${currentUser != null and currentUser.picture != null}" class="fa-solid fa-circle-user text-[28px]"></i>
      </button>

      <div
        data-dropdown-panel
        hidden
        class="absolute right-0 mt-2 w-44 origin-top-right animate-[dropdown-in_0.15s_ease-out] overflow-hidden rounded-xl border border-gray-100 bg-white py-1.5 shadow-xl"
      >
        <a
          th:href="@{/profile}"
          class="flex w-full cursor-pointer items-center gap-2.5 px-4 py-2.5 text-sm font-medium text-gray-700 transition-colors duration-150 hover:bg-gray-50"
        >
          <i class="fa-solid fa-user w-4 text-center text-[15px]"></i>
          Profile
        </a>
        <a
          href="/logout"
          class="flex w-full cursor-pointer items-center gap-2.5 px-4 py-2.5 text-sm font-medium text-gray-700 transition-colors duration-150 hover:bg-gray-50"
        >
          <i class="fa-solid fa-right-from-bracket w-4 text-center text-[15px]"></i>
          Logout
        </a>
      </div>
    </div>

  </div>
</header>

</body>
</html>
