server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # react-router-dom handles routing client-side - any path nginx doesn't
    # recognize as a real file falls back to index.html, letting React take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
