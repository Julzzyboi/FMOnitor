org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compiler throws (and corrupts its own cache) when the
# project and a dependency's source live on different Windows drive letters -
# it tries to compute a relative path between them, which is impossible
# across drives. This project is on S:, but the Pub package cache defaults to
# C:\Users\<you>\AppData\Local\Pub\Cache, so any plugin (e.g. google_sign_in_android)
# triggers it. Disabling incremental compilation avoids the crash entirely -
# builds are a bit slower, but reliable.
kotlin.incremental=false
